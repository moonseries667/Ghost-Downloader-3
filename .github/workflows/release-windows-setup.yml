name: Release Windows Setup

on:
  push:
    tags:
      - 'v*-win*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (留空默认 v<VERSION>-win)'
        required: false
        default: ''
        type: string
      create_release:
        description: '创建并上传到 GitHub Release'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  build-windows-setup:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Install dependencies
        run: |
          uv python install 3.13
          uv sync --locked --group dev

      - name: Run Windows regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --no-sync pytest tests/baidu_pack/ tests/quark_pack/ tests/telegram_pack/ tests/test_deploy.py tests/test_feature_service.py tests/test_main_window.py tests/test_task.py -q

      - name: Resolve version and release tag
        id: meta
        shell: pwsh
        run: |
          $version = uv run --no-sync python -c "exec(open('app/config/constants.py', encoding='utf-8').read()); print(VERSION)"
          $buildVersion = uv run --no-sync python -c "exec(open('app/config/constants.py', encoding='utf-8').read()); print(BUILD_VERSION)"
          $tag = "${{ github.event.inputs.release_tag }}"
          if (-not $tag) {
            if ("${{ github.ref_type }}" -eq "tag") {
              $tag = "${{ github.ref_name }}"
            } else {
              $tag = "v$version-win"
            }
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "build_version=$buildVersion" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Output "VERSION=$version BUILD_VERSION=$buildVersion TAG=$tag"

      - name: Build with Nuitka
        shell: pwsh
        run: |
          $buildVer = "${{ steps.meta.outputs.build_version }}"
          (Get-Content scripts/Ghost-Downloader-3.iss) `
            -replace 'APPLICATION_VERSION', $buildVer `
            -replace 'APPLICATION_ARCHITECTURES', 'x64compatible and not arm64' |
            Set-Content scripts/Ghost-Downloader-3.iss
          uv run --no-sync scripts/deploy.py
          if (-not (Test-Path "dist/Ghost-Downloader-3.dist/features/quark_pack/manifest.toml")) {
            throw "quark_pack missing from dist!"
          }
          if (-not (Test-Path "dist/Ghost-Downloader-3.dist/features/telegram_pack/manifest.toml")) {
            throw "telegram_pack missing from dist!"
          }
          if (-not (Test-Path "dist/Ghost-Downloader-3.dist/features/baidu_pack/manifest.toml")) {
            throw "baidu_pack missing from dist!"
          }

      - name: Build updater
        shell: pwsh
        run: |
          cmake -B build-updater -A x64 tools/updater
          cmake --build build-updater --config Release
          Copy-Item build-updater/Release/updater.exe dist/Ghost-Downloader-3.dist/

      - name: Build ghd
        shell: pwsh
        run: |
          cmake -B build-ghd -A x64 tools/ghd
          cmake --build build-ghd --config Release
          New-Item -ItemType Directory -Force dist/Ghost-Downloader-3.dist/bin
          Copy-Item build-ghd/Release/ghd.exe dist/Ghost-Downloader-3.dist/bin/

      - name: Download HDiffPatch
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/sisong/HDiffPatch/releases/download/v5.1.3/hdiffpatch_v5.1.3_bin_windows64.zip" -OutFile hdiffpatch.zip
          Expand-Archive hdiffpatch.zip -DestinationPath hdiffpatch
          Copy-Item hdiffpatch/windows64/hpatchz.exe dist/Ghost-Downloader-3.dist/

      - name: Download Inno Setup Translation Files
        run: uv run --no-sync python scripts/fetch_installer_languages.py

      - name: Build Windows Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.8
        with:
          path: scripts/Ghost-Downloader-3.iss

      - name: Package release assets
        shell: pwsh
        run: |
          $buildVer = "${{ steps.meta.outputs.build_version }}"
          $tag = "${{ steps.meta.outputs.tag }}"
          $setupSrc = "dist/Ghost-Downloader-v$buildVer-Windows-Setup.exe"
          $setupDst = "dist/Ghost-Downloader-$tag-Windows-x86_64-Setup.exe"
          $zipDst = "dist/Ghost-Downloader-$tag-Windows-x86_64.zip"
          if (-not (Test-Path $setupSrc)) {
            throw "Expected installer not found: $setupSrc"
          }
          Move-Item -Force $setupSrc $setupDst
          Push-Location dist/Ghost-Downloader-3.dist
          7z a -tzip -mx=9 -m0=LZMA "$env:GITHUB_WORKSPACE/$zipDst" *
          Pop-Location
          echo "SETUP_FILE=$setupDst" >> $env:GITHUB_ENV
          echo "ZIP_FILE=$zipDst" >> $env:GITHUB_ENV

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Ghost-Downloader-${{ steps.meta.outputs.tag }}-Windows-x86_64-Setup
          path: |
            ${{ env.SETUP_FILE }}
            ${{ env.ZIP_FILE }}

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || github.event.inputs.create_release == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $ver = "${{ steps.meta.outputs.version }}"
          $notes = @(
            "Ghost Downloader 3 Windows x86_64 安装包（基于上游 v$ver + QFW Fork）：",
            "",
            "- 新增夸克网盘下载模块（分享多链接折叠树精选下载、我的网盘浏览、自动转存与临时目录清理、扫码与 Cookie 登录）",
            "- 新增 Telegram 下载模块（tdl 运行时管理、软件内置二维码与 2FA 登录、紧急链接直下、个人私密频道收件箱与媒体组聚合下载）",
            "- 包含 Windows Setup 安装程序与绿色便携压缩包"
          ) -join "`n"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag "$env:SETUP_FILE" "$env:ZIP_FILE" --title "$tag" --notes $notes --latest
          } else {
            gh release upload $tag "$env:SETUP_FILE" "$env:ZIP_FILE" --clobber
          }
